allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Symlinks break Next.js standalone packaging
nodeLinker: hoisted
# pnpm 11 only reads this from a pnpm config file, not .npmrc. Keeps the inner
# `pnpm run` calls in package.json scripts from auto-running `pnpm install`.
verifyDepsBeforeRun: false
