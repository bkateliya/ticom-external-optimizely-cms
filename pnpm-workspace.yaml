allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: true
  protobufjs: true
  sharp: true
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Symlinks break Next.js standalone packaging
nodeLinker: hoisted
# Lockfile pins @ticom/* to Artifactory tarballs; the policy check rejects them
# against the public registry, so don't reinstall on every `pnpm run`.
verifyDepsBeforeRun: false
